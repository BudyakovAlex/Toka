name: TOKA station monitor
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'monitor.mjs'
      - '.github/workflows/monitor.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check stations and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node monitor.mjs
      - name: Test Telegram delivery (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node -e 'const t=process.env.TELEGRAM_BOT_TOKEN,c=process.env.TELEGRAM_CHAT_ID;if(!t||!c)throw Error("Missing Telegram secrets");fetch("https://api.telegram.org/bot"+t+"/sendMessage",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({chat_id:c,text:"✅ TOKA Monitor: тестове повідомлення. Telegram підключено!"})}).then(async r=>{const d=await r.json();if(!r.ok||!d.ok)throw Error("Telegram API: "+JSON.stringify({ok:d.ok,error_code:d.error_code,description:d.description}));console.log("Telegram test delivered")}).catch(e=>{console.error(e);process.exit(1)})'
      - name: Persist status
        run: |
          if git diff --quiet -- state.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update station monitoring state"
          git push
