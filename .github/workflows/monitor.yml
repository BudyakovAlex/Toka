name: TOKA station monitor
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: toka-station-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only TOKA diagnostic (production uses Vercel)
        run: node monitor.mjs
